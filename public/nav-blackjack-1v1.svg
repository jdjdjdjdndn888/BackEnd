<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bback" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bfront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2035"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Back card (rotated) -->
  <g transform="rotate(-8 16 24)">
    <rect x="3" y="7" width="24" height="34" rx="3.5" fill="url(#bback)" stroke="#4338ca" stroke-width="1.2"/>
    <rect x="5.5" y="9.5" width="19" height="29" rx="2" fill="none" stroke="#4338ca" stroke-width="0.7" opacity="0.5"/>
    <line x1="5" y1="9" x2="25" y2="40" stroke="#4338ca" stroke-width="0.6" opacity="0.35"/>
    <line x1="9" y1="7" x2="29" y2="38" stroke="#4338ca" stroke-width="0.6" opacity="0.35"/>
    <line x1="25" y1="9" x2="5" y2="40" stroke="#4338ca" stroke-width="0.6" opacity="0.35"/>
  </g>
  <!-- Front card -->
  <rect x="20" y="7" width="25" height="35" rx="3.5" fill="url(#bfront)" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="22.5" y="9.5" width="20" height="30" rx="2" fill="none" stroke="#2d3158" stroke-width="0.8"/>
  <!-- A♦ top-left -->
  <text x="24" y="18" font-family="Georgia,serif" font-size="9" font-weight="900" fill="#a78bfa">A</text>
  <text x="24.5" y="24" font-family="Georgia,serif" font-size="7" fill="#f472b6">♦</text>
  <!-- 21 center -->
  <text x="32.5" y="34" font-family="Georgia,serif" font-size="17" font-weight="900" fill="#fbbf24" text-anchor="middle">21</text>
  <!-- 1v1 badge overlapping both cards -->
  <rect x="13" y="20" width="13" height="9" rx="3.5" fill="url(#badge)"/>
  <text x="19.5" y="27" font-family="system-ui,sans-serif" font-size="6" font-weight="800" fill="white" text-anchor="middle">1v1</text>
</svg>
