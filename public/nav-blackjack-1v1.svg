<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Back card (dealer) -->
  <rect x="6" y="12" width="20" height="28" rx="3" fill="#1e2035" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Card back pattern -->
  <rect x="8" y="14" width="16" height="24" rx="2" fill="#312e81" opacity="0.6"/>
  <line x1="8" y1="14" x2="24" y2="38" stroke="#6366f1" stroke-width="0.8" opacity="0.4"/>
  <line x1="24" y1="14" x2="8" y2="38" stroke="#6366f1" stroke-width="0.8" opacity="0.4"/>
  <!-- Front card (player) -->
  <rect x="22" y="8" width="20" height="28" rx="3" fill="#13151f" stroke="#818cf8" stroke-width="1.5"/>
  <!-- 21 text on front card -->
  <text x="32" y="26" font-family="serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">21</text>
  <!-- Suit symbol -->
  <text x="32" y="33" font-family="serif" font-size="8" fill="#e879f9" text-anchor="middle">♣</text>
  <!-- VS badge -->
  <rect x="19" y="20" width="10" height="8" rx="3" fill="#7c3aed"/>
  <text x="24" y="27" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="white" text-anchor="middle">1v1</text>
</svg>
