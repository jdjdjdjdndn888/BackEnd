<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Card background -->
  <rect x="8" y="10" width="22" height="30" rx="3" fill="#1e2035" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="18" y="8" width="22" height="30" rx="3" fill="#13151f" stroke="#818cf8" stroke-width="1.5"/>
  <!-- Ace symbol on front card -->
  <text x="20" y="22" font-family="serif" font-size="12" font-weight="bold" fill="#e879f9" text-anchor="middle">A</text>
  <text x="20" y="34" font-family="serif" font-size="8" fill="#a5b4fc" text-anchor="middle">♠</text>
  <!-- Up arrow (Hi) -->
  <path d="M40 18 L36 24 L38.5 24 L38.5 30 L41.5 30 L41.5 24 L44 24 Z" fill="#4ade80" opacity="0.95"/>
  <!-- Down arrow (Lo) -->
  <path d="M40 38 L44 32 L41.5 32 L41.5 26 L38.5 26 L38.5 32 L36 32 Z" fill="#f87171" opacity="0.95"/>
  <!-- HI text -->
  <text x="10" y="17" font-family="sans-serif" font-size="6" font-weight="bold" fill="#4ade80" opacity="0.85">HI</text>
  <!-- LO text -->
  <text x="10" y="37" font-family="sans-serif" font-size="6" font-weight="bold" fill="#f87171" opacity="0.85">LO</text>
</svg>
