<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Castle tower base -->
  <rect x="10" y="22" width="28" height="22" rx="2" fill="#6366f1" opacity="0.9"/>
  <!-- Tower center spire -->
  <rect x="18" y="10" width="12" height="14" rx="2" fill="#818cf8"/>
  <!-- Left merlon -->
  <rect x="10" y="14" width="6" height="10" rx="1.5" fill="#818cf8"/>
  <!-- Right merlon -->
  <rect x="32" y="14" width="6" height="10" rx="1.5" fill="#818cf8"/>
  <!-- Center merlon top battlements -->
  <rect x="18" y="6" width="3" height="6" rx="1" fill="#a5b4fc"/>
  <rect x="23" y="6" width="3" height="6" rx="1" fill="#a5b4fc"/>
  <rect x="27" y="6" width="3" height="6" rx="1" fill="#a5b4fc"/>
  <!-- Door arch -->
  <path d="M20 44 L20 36 Q24 31 28 36 L28 44 Z" fill="#1e1b4b"/>
  <!-- Windows on tower sides -->
  <rect x="13" y="28" width="5" height="6" rx="1" fill="#1e1b4b" opacity="0.8"/>
  <rect x="30" y="28" width="5" height="6" rx="1" fill="#1e1b4b" opacity="0.8"/>
  <!-- Gem on top -->
  <polygon points="24,3 27,6 24,9 21,6" fill="#e879f9" opacity="0.95"/>
  <!-- Shine on gem -->
  <polygon points="24,3.5 25.5,5.5 24,5" fill="white" opacity="0.5"/>
