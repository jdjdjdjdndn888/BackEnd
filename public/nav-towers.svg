  <rect x="27" y="15" width="3" height="5" rx="0.5" fill="#fbbf24" opacity="0.25"/>
  <!-- Top gem -->
  <polygon points="24,1 27.5,5.5 24,10 20.5,5.5" fill="#e879f9"/>
  <polygon points="24,1 26,5 24,5" fill="white" opacity="0.55"/>
