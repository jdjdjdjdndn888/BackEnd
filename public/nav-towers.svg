  <!-- Battlement row -->
  <rect x="15" y="5" width="4" height="8" rx="1" fill="url(#tm)"/>
  <rect x="22" y="5" width="4" height="8" rx="1" fill="url(#tm)"/>
  <rect x="29" y="5" width="4" height="8" rx="1" fill="url(#tm)"/>
