<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="hcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d2e"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="lo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Card drop shadow -->
  <rect x="10" y="8" width="28" height="38" rx="4" fill="#6366f1" opacity="0.2"/>
  <!-- Card body -->
  <rect x="8" y="6" width="28" height="38" rx="4" fill="url(#hcard)" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Inner card border -->
  <rect x="10.5" y="8.5" width="23" height="33" rx="2.5" fill="none" stroke="#2a2d4a" stroke-width="1"/>
  <!-- Top-left rank -->
  <text x="12.5" y="18" font-family="Georgia,serif" font-size="11" font-weight="900" fill="#f1f5f9">A</text>
  <text x="13" y="24.5" font-family="Georgia,serif" font-size="9" fill="#e879f9">♠</text>
  <!-- Center spade -->
  <text x="22" y="35" font-family="Georgia,serif" font-size="20" fill="#e879f9" opacity="0.75" text-anchor="middle">♠</text>
  <!-- Bottom-right rank (rotated) -->
  <g transform="rotate(180 31 38)">
    <text x="28.5" y="44" font-family="Georgia,serif" font-size="11" font-weight="900" fill="#f1f5f9">A</text>
    <text x="29" y="50.5" font-family="Georgia,serif" font-size="9" fill="#e879f9">♠</text>
  </g>
  <!-- HI arrow pill -->
  <rect x="38" y="8" width="8" height="16" rx="4" fill="url(#hi)" opacity="0.95"/>
  <path d="M42 12 L39.5 16 L41 16 L41 20 L43 20 L43 16 L44.5 16 Z" fill="white" opacity="0.9"/>
  <!-- LO arrow pill -->
  <rect x="38" y="26" width="8" height="16" rx="4" fill="url(#lo)" opacity="0.95"/>
  <path d="M42 38 L44.5 34 L43 34 L43 30 L41 30 L41 34 L39.5 34 Z" fill="white" opacity="0.9"/>
</svg>
