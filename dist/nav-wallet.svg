<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="wbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="wflap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="wpocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2035"/>
      <stop offset="100%" stop-color="#13151f"/>
    </linearGradient>
    <radialGradient id="wgem" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </radialGradient>
  </defs>
  <!-- Wallet body -->
  <rect x="4" y="14" width="38" height="26" rx="6" fill="url(#wbody)"/>
  <!-- Top flap/fold -->
  <rect x="4" y="14" width="38" height="11" rx="6" fill="url(#wflap)"/>
  <rect x="4" y="21" width="38" height="4" fill="url(#wflap)"/>
  <!-- Stitch line -->
  <rect x="6" y="24" width="34" height="1" rx="0.5" fill="white" opacity="0.12"/>
  <!-- Coin pocket (right) -->
  <rect x="27" y="22" width="15" height="14" rx="4" fill="url(#wpocket)" stroke="#a5b4fc" stroke-width="1.2"/>
  <!-- Gem in pocket -->
  <circle cx="34.5" cy="29" r="5.5" fill="url(#wgem)"/>
  <path d="M34.5 23.5 L38 28 L34.5 32.5 L31 28 Z" fill="white" opacity="0.18"/>
  <ellipse cx="33" cy="26.5" rx="1.5" ry="1" fill="white" opacity="0.45"/>
  <!-- Card lines (left pocket area) -->
  <rect x="8" y="26" width="15" height="2" rx="1" fill="white" opacity="0.18"/>
  <rect x="8" y="30" width="10" height="2" rx="1" fill="white" opacity="0.13"/>
  <rect x="8" y="34" width="13" height="2" rx="1" fill="white" opacity="0.09"/>
</svg>
